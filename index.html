<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piper Robotics</title>
<meta name="theme-color" content="#1d1a14">
<link rel="icon" type="image/png" href="live/icons/icon-192.png">
<link rel="stylesheet" href="live/css/app.css">
<style>
  body { padding-bottom: 2rem; }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .app { display: flex; flex-direction: column; gap: .4rem; text-decoration: none; color: var(--ink); }
  .app b { font-size: 1.25rem; }
  .app:hover { border-color: var(--accent); }
  .foot { text-align: center; margin-top: 2rem; }
</style>
</head>
<body>
<header class="topbar"><div class="brand">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" fill="var(--accent-bright)" stroke="currentColor" stroke-width="1.4"/></svg>
  <span id="title">Piper Robotics</span></div></header>
<main>
  <div class="apps">
    <a class="card app" href="live/"><b id="liveTitle">Piper Robotics Live</b><span class="muted">For families: match schedules, results, rankings, live streams and match videos for our teams.</span></a>
    <a class="card app hidden" id="scout" href="#"><b>Scouting app</b><span class="muted">For our scouts and coaches.</span></a>
  </div>
  <p class="foot small muted"><a href="setup/">Team setup</a></p>
</main>
<script>
fetch('config.json', { cache: 'no-cache' }).then(r => r.json()).then(c => {
  if (c.name) { document.getElementById('title').textContent = c.name; document.title = c.name; }
  if (c.liveTitle) document.getElementById('liveTitle').textContent = c.liveTitle;
  if (c.scoutUrl) { const s = document.getElementById('scout'); s.href = c.scoutUrl; s.classList.remove('hidden'); }
}).catch(() => {});
</script>
</body>
</html>
